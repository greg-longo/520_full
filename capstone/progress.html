<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Commission Progress | DTSC 520</title>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#14110f; --card:#1b1714; --card2:#221d19; --border:#332b25;
  --text:#e6ded6; --dim:#a79c92; --bright:#fff;
  --accent:#7a5fb5; --accent-light:#b39ce0;
  --ok:#5cbb70; --warn:#e0a24a; --flag:#e0705c;
  --mono:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);line-height:1.65;
     font-family:'IBM Plex Sans',-apple-system,Segoe UI,sans-serif;}
.wrap{max-width:760px;margin:0 auto;padding:2.5rem 1.5rem 4rem;}
h1{font-family:'Zilla Slab',Georgia,serif;font-size:1.9rem;color:var(--bright);
   margin:0 0 .35rem;font-weight:600;}
h2{font-family:'Zilla Slab',Georgia,serif;font-size:1.15rem;color:var(--bright);
   margin:2.2rem 0 .6rem;font-weight:600;}
.lede{color:var(--dim);margin:0 0 1.4rem;max-width:68ch;}
p{max-width:70ch;}
a{color:var(--accent-light);}
code,.mono{font-family:var(--mono);font-size:.86em;}
.back{color:var(--dim);font-size:.85rem;text-decoration:none;display:inline-block;
      margin-bottom:1.2rem;}
.back:hover{color:var(--accent-light);}
.btn{font:600 .95rem 'IBM Plex Sans',sans-serif;padding:.6rem 1.3rem;
     border-radius:7px;cursor:pointer;background:var(--accent);
     border:1px solid var(--accent);color:#fff;text-decoration:none;
     display:inline-block;}
.btn:hover{filter:brightness(1.14);}
.btn:focus-visible{outline:3px solid var(--accent-light);outline-offset:2px;}
.btn-ghost{background:transparent;border-color:var(--border);color:var(--text);}

/* ---- the stage list. NOT a progress bar - see the note in the script. ---- */
.stages{list-style:none;padding:0;margin:1rem 0 0;}
.stage{display:flex;gap:.85rem;align-items:baseline;padding:.6rem .8rem;
       border:1px solid var(--border);border-left:3px solid var(--border);
       border-radius:7px;margin-bottom:.45rem;background:var(--card);}
.stage.done{border-left-color:var(--ok);}
.stage.here{border-left-color:var(--accent-light);background:var(--card2);}
.stage .n{font-family:var(--mono);font-size:.75rem;color:var(--dim);flex:0 0 auto;}
.stage .nm{color:var(--bright);flex:1 1 auto;}
.stage .st{font-family:var(--mono);font-size:.7rem;letter-spacing:.08em;
           text-transform:uppercase;flex:0 0 auto;}
.stage.done .st{color:var(--ok);}
.stage.here .st{color:var(--accent-light);}
.stage .st.todo{color:var(--dim);}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
      gap:.6rem;margin:1rem 0;}
.tile{background:var(--card);border:1px solid var(--border);border-radius:8px;
      padding:.8rem .9rem;}
.tile .v{font-family:var(--mono);font-size:1.5rem;color:var(--bright);line-height:1.2;}
.tile .k{color:var(--dim);font-size:.83rem;margin-top:.15rem;}

.panel{background:var(--card);border:1px solid var(--border);border-radius:10px;
       padding:1.1rem 1.25rem;margin:1rem 0;}
.note{border-left:3px solid var(--warn);background:rgba(224,162,74,.08);
      padding:.7rem .95rem;border-radius:0 7px 7px 0;margin:1.2rem 0;font-size:.93rem;}
.empty{text-align:center;padding:2rem 1rem;}
.dl{display:flex;gap:.6rem;padding:.35rem 0;border-top:1px solid var(--border);
    font-size:.93rem;}
.dl:first-child{border-top:0;}
.dl .lbl{color:var(--dim);flex:0 0 42%;}
.dl .val{color:var(--text);}
.vh{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
    clip:rect(0,0,0,0);white-space:nowrap;border:0;}
</style>
<link rel="stylesheet" href="/520_full/auth/auth.css">
<link rel="stylesheet" href="/520_full/assets/shell.css">
<script src="/520_full/auth/auth.js" defer></script>
<script src="/520_full/assets/shell.js" defer></script>
<script src="/520_full/assets/tool-back.js" defer></script>
</head>
<body data-auth-required>
<div id="auth-slot" class="auth-slot-fixed"></div>

<div class="wrap">
  <a class="back" href="index.html" id="backLink">&larr; Capstone</a>
  <h1>Your commission so far</h1>
  <p class="lede">Where you are in the Academic Success Report, and what you have
  decided. Read from this browser only - nothing here is submitted or graded.</p>

  <div id="body"></div>
</div>

<script>
"use strict";

const KEY = "dtsc520_capstone_progress";
const STAGE_NAMES = ["Frame", "Assemble", "Compute", "Clean & Join",
                     "Visualize", "Ship"];

function esc(s){ return String(s).replace(/[&<>]/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }

function read() {
  // The capstone is the only writer. Anything unreadable is treated as "not
  // started" rather than an error: a student whose storage was cleared should
  // get an invitation to begin, not a stack trace about JSON.
  try {
    const raw = window.localStorage.getItem(KEY);
    if (!raw) return null;
    const d = JSON.parse(raw);
    return (d && typeof d.beatIndex === "number") ? d : null;
  } catch (e) {
    return null;
  }
}

function plural(n, one, many) { return n === 1 ? one : (many || one + "s"); }

function render() {
  const el = document.getElementById("body");
  const d = read();

  if (!d) {
    el.innerHTML = `
      <div class="panel empty">
        <h2 style="margin-top:0;">Not started yet</h2>
        <p style="margin:0 auto 1.1rem;">Once you open the commission and work
        through the first beat, your position will show up here.</p>
        <a class="btn" href="commission.html">Open the commission</a>
      </div>
      <div class="note">This page reads your progress from <strong>this browser
      only</strong>. If you have been working in a different browser, or in a
      private window, your progress lives there and not here.</div>`;
    return;
  }

  const total = d.totalStages || STAGE_NAMES.length;
  const stage = Math.max(0, Math.min(total - 1, d.stage || 0));
  const decisions = d.decisions ? Object.keys(d.decisions).length : 0;
  const code = Array.isArray(d.codePassed) ? d.codePassed.length
             : (d.codePassed ? Object.keys(d.codePassed).length : 0);
  const lines = Array.isArray(d.reportLines) ? d.reportLines.length : 0;
  const ethics = Array.isArray(d.ethics) ? d.ethics.length
               : (d.ethics ? Object.keys(d.ethics).length : 0);

  const stages = STAGE_NAMES.slice(0, total).map((name, i) => {
    const cls = i < stage ? "done" : i === stage ? "here" : "";
    const label = i < stage ? "done" : i === stage ? "you are here" : "ahead";
    const st = i > stage ? '<span class="st todo">ahead</span>'
                         : `<span class="st">${label}</span>`;
    return `<li class="stage ${cls}"><span class="n">${i + 1}</span>` +
           `<span class="nm">${esc(name)}</span>${st}</li>`;
  }).join("");

  el.innerHTML = `
    <h2>Stages</h2>
    <ul class="stages">${stages}</ul>

    <h2>What you have done</h2>
    <div class="grid">
      <div class="tile"><div class="v">${decisions}</div>
        <div class="k">${plural(decisions, "decision")} recorded</div></div>
      <div class="tile"><div class="v">${code}</div>
        <div class="k">code ${plural(code, "task")} passed</div></div>
      <div class="tile"><div class="v">${lines}</div>
        <div class="k">report ${plural(lines, "line")} written</div></div>
      ${ethics ? `<div class="tile"><div class="v">${ethics}</div>
        <div class="k">ethics ${plural(ethics, "call")} made</div></div>` : ""}
    </div>

    <div class="panel">
      <div class="dl"><span class="lbl">Current stage</span>
        <span class="val">${stage + 1} of ${total} - ${esc(STAGE_NAMES[stage])}</span></div>
      <div class="dl"><span class="lbl">Beats walked</span>
        <span class="val">${d.beatIndex}</span></div>
      ${d.savedAt ? `<div class="dl"><span class="lbl">Last worked on</span>
        <span class="val">${new Date(d.savedAt).toLocaleString()}</span></div>` : ""}
    </div>

    <p><a class="btn" href="commission.html">Continue the commission</a>
       <a class="btn btn-ghost" href="index.html">Capstone overview</a></p>

    <div class="note"><strong>There is no percentage here, and no time
    estimate.</strong> That is deliberate. The commission turns on judgement
    calls that have costs - what to do about the missing data, whether to use
    the bias features - and a progress bar quietly argues for finishing over
    deciding well. The stage you are on and the calls you have made are the
    honest measures; how fast you got there is not one.</div>

    <p style="color:var(--dim);font-size:.9rem;">Read from this browser's local
    storage. Nothing on this page is submitted, and it is not your grade.</p>`;
}

render();
</script>
</body>
</html>
