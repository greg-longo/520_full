<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Cabinet Commission - DTSC 520 Capstone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
<style>
  :root {
    --bg:#0a0c11; --panel:#11151d; --panel2:#161b25; --line:#272d3a; --line2:#333b4b;
    --ink:#eef1f6; --ink-dim:#a3abbd; --ink-mute:#626c80;
    --brass:#c9a24a; --brass-l:#e3c075; --maroon:#8B1C40; --maroon-l:#c25a7a;
    --on:#5ec99a; --warn:#dab153; --bad:#cf6b7e;
    --serif:'Newsreader',Georgia,serif; --sans:'Zilla Slab',Georgia,serif; --mono:'IBM Plex Mono',monospace;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; }
  body { background:var(--bg); color:var(--ink); font-family:var(--sans); line-height:1.6; overflow:hidden; }
  code { font-family:var(--mono); font-size:0.9em; color:var(--brass-l); }

  /* ===== APP WINDOW FRAME ===== */
  #appwin { position:fixed; inset:0; display:flex; flex-direction:column; }
  .titlebar { display:flex; align-items:center; gap:10px; padding:0.5rem 1rem; background:var(--panel); border-bottom:1px solid var(--line); flex-shrink:0; }
  .tb-dots { display:flex; gap:6px; } .tb-dots i { width:11px; height:11px; border-radius:50%; display:block; }
  .tb-dots i:nth-child(1){background:#e0626d;} .tb-dots i:nth-child(2){background:#dab153;} .tb-dots i:nth-child(3){background:#5ec99a;}
  .tb-title { font-family:var(--mono); font-size:0.74rem; color:var(--ink-dim); letter-spacing:0.03em; }
  .tb-title b { color:var(--ink); font-weight:600; }
  .tb-spacer { flex:1; }
  .tb-home { font-family:var(--mono); font-size:0.68rem; color:var(--ink-mute); text-decoration:none; }
  .tb-home:hover { color:var(--ink-dim); }

  /* ===== MAIN GRID: thread | work | report ===== */
  .grid { flex:1; display:grid; grid-template-columns: 270px 1fr; min-height:0; }
  @media (max-width:1180px){ .grid{ grid-template-columns: 230px 1fr; } }
  @media (max-width:880px){ .grid{ grid-template-columns: 1fr; } .thread{ display:none; } }

  /* Amy thread (left) */
  .thread { background:var(--panel); border-right:1px solid var(--line); display:flex; flex-direction:column; min-height:0; }
  .thread-head { padding:0.9rem 1rem 0.7rem; border-bottom:1px solid var(--line); display:flex; gap:0.65rem; align-items:center; }
  .avatar { width:42px; height:42px; border-radius:50%; flex-shrink:0; border:1.5px solid var(--brass); }
  /* emotion avatar: a round frame holding either a GIF (img) or the SVG fallback, with crossfade */
  .av { display:inline-block; position:relative; border-radius:50%; flex-shrink:0; border:1.5px solid var(--brass); overflow:hidden; background:#1b2330; }
  .av img, .av svg { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  /* No transition on frame swaps - blinks and idle cycling must be instant (frame animation).
     A 0.3s opacity transition here made each blink linger ~0.8s. */
  .av .av-frame.gone { opacity:0; }
  .thread-who { font-weight:600; font-size:0.95rem; }
  .thread-role { font-family:var(--mono); font-size:0.62rem; color:var(--ink-mute); text-transform:uppercase; letter-spacing:0.08em; }
  .thread-msgs { flex:1; overflow-y:auto; padding:1rem 0.9rem; display:flex; flex-direction:column; gap:0.7rem; }
  .msg { background:var(--panel2); border:1px solid var(--line); border-radius:10px 10px 10px 3px; padding:0.6rem 0.8rem; font-size:0.86rem; color:var(--ink-dim); cursor:pointer; transition:border-color 0.15s; }
  .msg:hover { border-color:var(--line2); }
  .msg.fresh { border-color:var(--brass); }
  .msg-text { line-height:1.5; }
  .msg.collapsed .msg-text { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .msg.collapsed .msg-time { display:none; }
  .msg-foot { display:flex; justify-content:space-between; align-items:center; margin-top:0.4rem; }
  .msg-time { font-family:var(--mono); font-size:0.58rem; color:var(--ink-mute); }
  .msg-more { font-family:var(--mono); font-size:0.58rem; color:var(--brass); }
  .msg.collapsed .msg-more::after { content:'more'; }
  .msg:not(.collapsed) .msg-more::after { content:'less'; }

  /* work column */
  .work { display:flex; flex-direction:column; min-height:0; position:relative; }
  .stage-strip { display:flex; gap:0.3rem; padding:0.6rem 1.2rem; border-bottom:1px solid var(--line); background:var(--panel); flex-wrap:wrap; align-items:center; }
  .chip { font-family:var(--mono); font-size:0.6rem; color:var(--ink-mute); padding:2px 8px; border-radius:12px; display:flex; gap:5px; align-items:center; white-space:nowrap; }
  .chip .cd { width:7px; height:7px; border-radius:50%; background:currentColor; opacity:0.5; }
  .chip.active { color:var(--brass); border:1px solid rgba(201,162,74,0.4); } .chip.done { color:var(--on); }
  .chip.active .cd, .chip.done .cd { opacity:1; }
  .strip-spacer { flex:1; }
  .report-toggle { display:none; font-family:var(--mono); font-size:0.62rem; color:var(--brass); background:none; border:1px solid var(--line2); border-radius:5px; padding:3px 9px; cursor:pointer; }
  @media (max-width:1024px){ .grid.has-report .report-toggle{ display:block; } }

  .stage-body { flex:1; overflow-y:auto; padding:2rem 2rem 6rem; }
  .beatwrap { max-width:620px; margin:0 auto; }

  /* ===== BEAT: dialogue ===== */
  /* Start the content near the top (not vertically centered) so the block doesn't
     drift up as the typewriter fills lines. */
  .beat-dialogue { min-height:48vh; display:flex; flex-direction:column; justify-content:flex-start; padding-top:6vh; }
  .speaker { display:flex; gap:0.8rem; align-items:center; margin-bottom:1.1rem; }
  .speaker .avatar { width:48px; height:48px; }
  .speaker-name { font-weight:600; } .speaker-sub { font-family:var(--mono); font-size:0.62rem; color:var(--ink-mute); text-transform:uppercase; letter-spacing:0.08em; }
  .dialogue { font-family:var(--serif); font-size:1.32rem; line-height:1.65; color:var(--ink); min-height:9em; text-align:left; overflow-wrap:break-word; }
  .dialogue .cursor { display:inline-block; width:0.5ch; background:var(--brass); animation:blink 1s step-end infinite; }
  @keyframes blink { 50%{opacity:0;} }

  /* ===== BEAT: interstitial (text only, dark) ===== */
  .beat-interstitial { min-height:60vh; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; padding-top:7vh; }
  .inter-avatar { margin-bottom:0.9rem; }
  .inter-avatar .av { width:96px; height:96px; border-width:2px; }
  .inter-name { font-family:var(--mono); font-size:0.66rem; letter-spacing:0.14em; text-transform:uppercase; color:var(--brass); margin-bottom:1.1rem; text-align:center; }
  /* Left-aligned so typing grows down/right without re-centering each character. Fixed width = no horizontal jump. */
  .interstitial-text { font-family:var(--serif); font-size:1.42rem; line-height:1.7; color:var(--ink); width:100%; max-width:540px; text-align:left; min-height:8.5em; overflow-wrap:break-word; }

  /* ===== BEAT: decision ===== */
  .d-label { font-family:var(--mono); font-size:0.66rem; letter-spacing:0.1em; text-transform:uppercase; color:var(--maroon-l); margin-bottom:0.5rem; }
  .d-q { font-size:1.18rem; font-weight:600; margin-bottom:1rem; line-height:1.45; }
  .choices { display:flex; flex-direction:column; gap:0.6rem; }
  .choice { text-align:left; background:var(--panel); color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:0.85rem 1rem 0.85rem 2.7rem; position:relative; cursor:pointer; font-family:var(--sans); font-size:0.98rem; line-height:1.5; transition:border-color 0.15s, background 0.15s; }
  .choice:hover:not(:disabled){ border-color:var(--brass); background:var(--panel2); }
  .choice:disabled{ cursor:default; opacity:0.92; }
  .choice .ck { position:absolute; left:0.8rem; top:0.85rem; width:22px; height:22px; border-radius:5px; background:var(--bg); color:var(--ink-mute); font-family:var(--mono); font-size:0.76rem; display:grid; place-items:center; }
  .choice.pick-good{ border-color:var(--on); background:rgba(94,201,154,0.08);} .choice.pick-good .ck{background:rgba(94,201,154,0.22);color:var(--on);}
  .choice.pick-warn{ border-color:var(--warn); background:rgba(218,177,83,0.08);} .choice.pick-warn .ck{background:rgba(218,177,83,0.22);color:var(--warn);}
  .choice.pick-bad{ border-color:var(--bad); background:rgba(207,107,126,0.08);} .choice.pick-bad .ck{background:rgba(207,107,126,0.22);color:var(--bad);}
  .outcome { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:0.9rem 1.1rem; margin-top:1rem; }
  .outcome.good{border-top:3px solid var(--on);} .outcome.warn{border-top:3px solid var(--warn);} .outcome.bad{border-top:3px solid var(--bad);}
  .outcome-t { font-family:var(--mono); font-size:0.8rem; font-weight:600; margin-bottom:0.4rem; }
  .outcome.good .outcome-t{color:var(--on);} .outcome.warn .outcome-t{color:var(--warn);} .outcome.bad .outcome-t{color:var(--bad);}
  .outcome p { font-size:0.92rem; color:var(--ink-dim); }

  /* ===== BEAT: code ===== */
  .lab-task { font-size:0.96rem; color:var(--ink); margin-bottom:0.4rem; }
  .lab-hint-inline { font-size:0.85rem; color:var(--ink-dim); margin-bottom:0.8rem; }
  textarea.editor { width:100%; min-height:170px; resize:vertical; background:#080a0e; color:#e8ecf3; border:1px solid var(--line); border-radius:7px; font-family:var(--mono); font-size:0.84rem; line-height:1.6; padding:0.85rem; tab-size:4; }
  textarea.editor:focus { outline:none; border-color:var(--brass); }
  .lab-btns { display:flex; gap:0.5rem; margin-top:0.7rem; flex-wrap:wrap; }
  .btn { font-family:var(--mono); font-size:0.78rem; font-weight:600; padding:0.55rem 1.2rem; border:none; border-radius:6px; cursor:pointer; }
  .btn-run { background:var(--brass); color:#191205; } .btn-run:disabled{ opacity:0.5; cursor:not-allowed; }
  .btn-ghost { background:transparent; color:var(--ink-dim); border:1px solid var(--line2); }
  .btn-ghost:hover { color:var(--ink); border-color:var(--ink-mute); }
  .console { margin-top:0.7rem; background:#080a0e; border:1px solid var(--line); border-radius:6px; font-family:var(--mono); font-size:0.78rem; padding:0.75rem; min-height:34px; white-space:pre-wrap; color:var(--ink-dim); overflow-x:auto; }
  .console .ok{color:var(--on);} .console .err{color:var(--bad);} .console .sys{color:var(--brass-l);}

  /* continue / nav */
  .beat-nav { display:flex; justify-content:flex-end; align-items:center; gap:1rem; margin-top:1.6rem; }
  .skip-hint { font-family:var(--mono); font-size:0.66rem; color:var(--ink-mute); letter-spacing:0.04em; opacity:0.7; user-select:none; }
  .btn-cont { background:var(--brass); color:#191205; font-family:var(--mono); font-size:0.84rem; font-weight:600; padding:0.7rem 1.7rem; border:none; border-radius:7px; cursor:pointer; }
  .btn-cont:disabled { opacity:0.32; cursor:not-allowed; }
  .btn-cont.ghost { background:transparent; color:var(--ink-dim); border:1px solid var(--line2); }

  /* ===== REPORT PANEL (right, overlay on small) =====
     Hidden until the first finding lands (avoids an empty, misaligned column). */
  .report { display:none; width:300px; background:var(--panel); border-left:1px solid var(--line); flex-direction:column; min-height:0; }
  .grid.has-report .report { display:flex; }
  @media (min-width:1025px){ .grid.has-report{ grid-template-columns:270px 1fr 300px; } }
  @media (max-width:1024px){
    .report { position:fixed; top:var(--shell-h, 0px); right:0; bottom:0; width:320px; max-width:88vw; z-index:60; transform:translateX(100%); transition:transform 0.25s; box-shadow:-12px 0 40px rgba(0,0,0,0.5); }
    .grid.has-report .report { display:flex; transform:translateX(100%); }   /* present but off-screen until toggled */
    .report.open { transform:translateX(0) !important; }
  }
  .report-head { padding:0.9rem 1rem; border-bottom:1px solid var(--line); }
  .report-doc-label { font-family:var(--mono); font-size:0.58rem; letter-spacing:0.14em; text-transform:uppercase; color:var(--brass); }
  .report-title { font-family:var(--serif); font-size:1.05rem; font-weight:500; margin-top:0.15rem; }
  .report-body { flex:1; overflow-y:auto; padding:1rem; font-family:var(--serif); }
  .report-line { font-size:0.9rem; color:var(--ink-dim); padding:0.6rem 0; border-bottom:1px solid var(--line); line-height:1.5; opacity:0; transform:translateY(6px); animation:rin 0.5s forwards; }
  @keyframes rin { to{opacity:1;transform:none;} }
  .report-line b { color:var(--ink); font-weight:500; }
  .report-line .rl-tag { display:block; font-family:var(--mono); font-size:0.58rem; text-transform:uppercase; letter-spacing:0.08em; color:var(--brass); margin-bottom:0.2rem; }

  /* loading */
  #loading { position:fixed; inset:0; background:var(--bg); z-index:200; display:grid; place-items:center; text-align:center; }
  .spin { width:34px; height:34px; border:3px solid var(--line); border-top-color:var(--brass); border-radius:50%; animation:spin 0.9s linear infinite; margin:0 auto 14px; }
  @keyframes spin { to{transform:rotate(360deg);} }
  .load-t { font-family:var(--mono); font-size:0.8rem; color:var(--ink-dim); } .load-s { font-family:var(--mono); font-size:0.66rem; color:var(--ink-mute); margin-top:6px; }

  .fade-in { animation:fadein 0.4s ease; } @keyframes fadein { from{opacity:0;transform:translateY(8px);} to{opacity:1;transform:none;} }
  .flash-ok { animation:fok 0.7s ease; } @keyframes fok { 0%,100%{background:#080a0e;} 30%{background:rgba(94,201,154,0.12);} }
  .hidden { display:none !important; }
  a:focus-visible,button:focus-visible,textarea:focus-visible { outline:2px solid var(--brass-l); outline-offset:2px; }
  textarea.editor:focus-visible{ outline:none; }
  @media (prefers-reduced-motion: reduce){ .spin,.flash-ok,.fade-in,.report-line,.dialogue .cursor{ animation:none; opacity:1; transform:none; } }
  ::-webkit-scrollbar{ width:9px; } ::-webkit-scrollbar-thumb{ background:var(--line2); border-radius:5px; }
  .fig-out { display:block; max-width:100%; margin:.7rem 0 .2rem; border-radius:6px; background:#fff; }
</style>

<script>
/* ===================== REFINED JUICE ===================== */
(function(){
  const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let muted=false, actx=null, master=null;
  function ctx(){ if(!actx){ actx=new (window.AudioContext||window.webkitAudioContext)(); master=actx.createGain(); master.gain.value=0.5; const lp=actx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=2600; master.connect(lp); lp.connect(actx.destination);} return actx; }
  /* warm tone: triangle/sine, gentle attack + smooth release */
  function note(freq, dur, {type='sine', vol=0.16, when=0, attack=0.012}={}){
    if(muted) return; try{
      const a=ctx(), t=a.currentTime+when;
      const o=a.createOscillator(), g=a.createGain();
      o.type=type; o.frequency.setValueAtTime(freq,t);
      g.gain.setValueAtTime(0,t);
      g.gain.linearRampToValueAtTime(vol,t+attack);
      g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
      o.connect(g); g.connect(master);
      o.start(t); o.stop(t+dur+0.02);
    }catch(e){}
  }
  window.sfx = {
    key:  ()=>note(660,0.05,{type:'sine',vol:0.02,attack:0.002}),
    /* correct: warm two-note rising "logged" chime */
    pass: ()=>{ note(523.25,0.5,{type:'sine',vol:0.14}); note(783.99,0.6,{type:'triangle',vol:0.10,when:0.1}); },
    /* miss: soft low fall, no buzz */
    fail: ()=>{ note(311.13,0.4,{type:'sine',vol:0.12}); note(233.08,0.55,{type:'sine',vol:0.10,when:0.09}); },
    /* hint: single soft mid tone */
    hint: ()=>note(587.33,0.35,{type:'triangle',vol:0.09}),
    /* finale: warm ascending phrase */
    win:  ()=>{ [523.25,659.25,783.99,1046.5].forEach((f,i)=>note(f,0.7,{type:'sine',vol:0.13,when:i*0.16,attack:0.02})); note(1318.5,0.9,{type:'triangle',vol:0.08,when:0.64}); },
    advance: ()=>note(440,0.18,{type:'sine',vol:0.06,attack:0.004})
  };
  function setMuted(m){ muted=m; const b=document.getElementById('juiceMute'); if(b){b.textContent=muted?'♪̸':'♪'; b.style.textDecoration=muted?'line-through':'none'; b.setAttribute('aria-pressed',String(muted));} try{localStorage.setItem('dtsc520_muted',muted?'1':'0');}catch(e){} }
  window.setMuted=setMuted; document.getElementById('juiceMute').addEventListener('click',()=>setMuted(!muted));
  try{ setMuted(localStorage.getItem('dtsc520_muted')==='1'); }catch(e){}
  /* shorter, tasteful confetti: ~140 frames, fewer pieces, brass/navy */
  window.confettiBurst=function(count=70){
    if(REDUCED) return;
    const cv=document.getElementById('juiceConfetti'); cv.style.display='block'; cv.width=innerWidth; cv.height=innerHeight;
    const ctx2=cv.getContext('2d'); const cols=['#c9a24a','#e3c075','#5ec99a','#8B1C40','#eef1f6'];
    const ps=Array.from({length:count},()=>({x:cv.width*0.5+(Math.random()-0.5)*cv.width*0.5, y:cv.height*0.32, vx:(Math.random()-0.5)*7, vy:-4-Math.random()*7, s:4+Math.random()*5, r:Math.random()*Math.PI, vr:(Math.random()-0.5)*0.3, c:cols[Math.floor(Math.random()*cols.length)], life:1}));
    let fr=0;
    (function d(){ ctx2.clearRect(0,0,cv.width,cv.height);
      ps.forEach(p=>{ p.vy+=0.28; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; p.life-=0.007; ctx2.globalAlpha=Math.max(0,p.life); ctx2.save(); ctx2.translate(p.x,p.y); ctx2.rotate(p.r); ctx2.fillStyle=p.c; ctx2.fillRect(-p.s/2,-p.s/2,p.s,p.s*0.55); ctx2.restore(); });
      ctx2.globalAlpha=1;
      if(++fr<140) requestAnimationFrame(d); else { ctx2.clearRect(0,0,cv.width,cv.height); cv.style.display='none'; }
    })();
  };
  window.screenShake=function(){ if(REDUCED) return; document.getElementById('beat').animate([{transform:'translate(0,0)'},{transform:'translate(-4px,0)'},{transform:'translate(3px,0)'},{transform:'translate(0,0)'}],{duration:200,easing:'ease-in-out'}); };
})();

/* ===================== JAMIE AVATAR (inline SVG) ===================== */
const JAMIE_SVG = `
<defs><clipPath id="cir"><circle cx="50" cy="50" r="50"/></clipPath></defs>
<g clip-path="url(#cir)">
  <rect width="100" height="100" fill="#1b2330"/>
  <circle cx="50" cy="86" r="34" fill="#2a3344"/>

/* ===================== JAMIE AVATAR — FRAME CYCLING =====================
   Provide STILL frames in capstone/assets/ named:
       jamie-<emotion>-1.png, jamie-<emotion>-2.png, ...   (idle frames; 1+)
       jamie-<emotion>-blink.png                            (optional eyes-closed)
   Emotions: neutral, approve, concern, disappoint, warm.
   The engine probes which files exist and cycles only those:
     - gently cycles idle frames (faster while Amy is "talking"),
     - blinks occasionally if a -blink frame exists,
     - crossfades when the emotion changes,
     - falls back to the inline SVG if an emotion has no frames at all.
   Everything degrades gracefully: one frame = static; no blink = no blink. */
const EMOTIONS = ['neutral','approve','concern','disappoint','warm'];
const AV = {
  emotion:'neutral', frame:0, talking:false, blinking:false,
  frames:{},            /* emotion -> [src,...] that actually loaded */
  blink:{},             /* emotion -> blink src if it loaded */
  ready:{},             /* emotion -> true once probed */
  timer:null, blinkTimer:null
};
const avSrc = (e,f)=>`assets/jamie-${e}-${f}.png`;

/* Probe up to N idle frames + a blink frame for an emotion; keep the ones that load. */
function probeEmotion(e, maxFrames=6){
  AV.frames[e]=[]; AV.blink[e]=null;
  let pending=maxFrames+1;
  const done=()=>{ if(--pending===0){ AV.ready[e]=true; remountAvatars(); } };
  for(let i=1;i<=maxFrames;i++){
    const img=new Image(); const src=avSrc(e,i);
    img.onload=()=>{ AV.frames[e][i-1]=src; done(); };
    img.onerror=done; img.src=src;
  }
  const b=new Image(); const bsrc=avSrc(e,'blink');
  b.onload=()=>{ AV.blink[e]=bsrc; done(); };
  b.onerror=done; b.src=bsrc;
}
function probeAllEmotions(){ EMOTIONS.forEach(e=>probeEmotion(e)); }

/* Avatar markup: an <img> layer (frames) over the SVG fallback. */
/* Every known frame URL (all emotions' idle frames + blinks), so we can stack them
   ALL as preloaded <img> layers per avatar and just toggle visibility - no src swaps,
   no decode lag, so a blink is exactly as long as we say. */
function allFrameSrcs(){
  const out=[];
  EMOTIONS.forEach(e=>{
    (AV.frames[e]||[]).filter(Boolean).forEach(s=>out.push(s));
    if(AV.blink[e]) out.push(AV.blink[e]);
  });
  return [...new Set(out)];
}
function currentSrc(){
  const fr=(AV.frames[AV.emotion]||[]).filter(Boolean);
  return fr.length ? fr[AV.frame % fr.length] : null;
}
function avatarHTML(size){
  const srcs=allFrameSrcs();
  const active=currentSrc();
  const layers = srcs.map(s=>`<img alt="" class="av-frame${s===active?'':' gone'}" data-src="${s}" src="${s}">`).join('');
  return `<span class="av" style="width:${size}px;height:${size}px;">
    <svg viewBox="0 0 100 100" aria-hidden="true">${JAMIE_SVG}</svg>
    ${layers}
  </span>`;
}
/* Show exactly one stacked layer (by src) instantly; hide the rest. If no frames
   exist yet, hide all and the SVG shows through. */
function paintAvatars(src){
  if(src===undefined) src=currentSrc();
  document.querySelectorAll('.av').forEach(av=>{
    let shown=false;
    av.querySelectorAll('.av-frame').forEach(img=>{
      if(src && img.getAttribute('data-src')===src){ img.classList.remove('gone'); shown=true; }
      else img.classList.add('gone');
    });
    /* If the wanted frame isn't a mounted layer yet (probe race), inject it now so the
       portrait always shows instead of falling back to the SVG. */
    if(src && !shown){
      const img=document.createElement('img');
      img.alt=''; img.className='av-frame'; img.setAttribute('data-src',src); img.src=src;
      av.appendChild(img);
    }
  });
}
/* When new frames finish probing after avatars are on screen, rebuild any mounted
   avatar's stacked layers so the new frames are present & preloaded. */
function remountAvatars(){
  document.querySelectorAll('.av').forEach(av=>{
    const sz=parseInt(av.style.width)||42;
    av.innerHTML=`<svg viewBox="0 0 100 100" aria-hidden="true">${JAMIE_SVG}</svg>`+
      allFrameSrcs().map(s=>`<img alt="" class="av-frame gone" data-src="${s}" src="${s}">`).join('');
  });
  paintAvatars();
}
/* Switch expression. */
function setAvatar(emotion){
  if(!EMOTIONS.includes(emotion)) emotion='neutral';
  AV.emotion=emotion; AV.frame=0;
  paintAvatars();
}
/* Briefly react, then settle back to neutral. */
function reactAvatar(emotion, settleMs=2400){
  setAvatar(emotion);
  clearTimeout(AV.settle);
  AV.settle=setTimeout(()=>setAvatar('neutral'), settleMs);
}
/* Idle/talk cycle: advance idle frame; speed depends on talking. */
function avTick(){
  const fr=(AV.frames[AV.emotion]||[]).filter(Boolean);
  /* Don't repaint mid-blink (would cut the blink short or fight it). */
  if(!AV.blinking && fr.length>1){ AV.frame=(AV.frame+1)%fr.length; paintAvatars(); }
  /* Calmer cadence: a gentle idle drift, slightly livelier (not flickery) while talking. */
  AV.timer=setTimeout(avTick, AV.talking?620:2200);
}
/* Normally-distributed sample (Box-Muller), clamped so blinks never bunch up. */
function gaussMs(meanMs, sdMs, floorMs){
  const u=Math.random()||1e-9, v=Math.random();
  const z=Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);
  return Math.max(floorMs, meanMs + z*sdMs);
}
/* Blink: a quick, atomic flash of the blink frame, then back to the current idle frame.
   Marked with AV.blinking so the idle cycle leaves it alone. */
function avBlink(){
  const b=AV.blink[AV.emotion];
  if(b && !AV.blinking){
    AV.blinking=true; paintAvatars(b);
    setTimeout(()=>{ AV.blinking=false; paintAvatars(); }, 110);   /* ~110ms = a natural human blink */
  }
  /* Gap ~ Normal: idle mean 10s (sd 1.5s); a touch more often while speaking. Floor 3s so two never collide. */
  const gap = AV.talking ? gaussMs(7000,1500,2500) : gaussMs(10000,1500,3000);
  AV.blinkTimer=setTimeout(avBlink, gap);
}
function startAvatarLife(){
  if(REDUCED){ paintAvatars(); return; }   /* reduced motion: static frame only */
  clearTimeout(AV.timer); clearTimeout(AV.blinkTimer); AV.blinking=false;
  avTick(); setTimeout(avBlink, 2500);
}
function setTalking(on){ AV.talking=!!on; }

        out.append(float(t) if t not in ('', 'None', 'nan') else np.nan)
    return np.array(out, dtype=float)

logins     = df['logins_per_week'].to_numpy(dtype=float)
time_hrs   = df['time_on_task_hrs'].to_numpy(dtype=float)
submission = _to_number(df['submission_rate'])
attendance = df['hs_attendance'].to_numpy(dtype=float)
`;

/* The three ethics calls, which are graded differently from everything else.
   D-spec: "honors tiers based on judgment + code, not just completion - the
   values are part of the grade." So a technically strong run that took the
   biased-feature shortcut does NOT get the top tier, and no amount of points
   buys it back. */
function ethicsRecord(){
  const q = id => (state.decisions[id]||{}).quality || null;
  return [
    { id:'s1_ethics', label:'Excluded the two unfair proxies',
      ok: !!state.ethics.excludedProxies, quality: state.ethics.excludedProxies ? 'good' : null },
    { id:'s5_axis',  label:'Refused the truncated axis',       ok: q('s5_axis')==='good',  quality:q('s5_axis') },
    { id:'s6_score', label:'Refused the per-student ranking',  ok: q('s6_score')==='good', quality:q('s6_score') },
  ];
}

function honours(){
  const e = ethicsRecord();
  const tookShortcut = e.some(x => x.quality === 'bad');
  const allEthics    = e.every(x => x.ok);
  const ratio = state.maxPoints ? state.points / state.maxPoints : 0;
  const allCode = Object.keys(state.codePassed).length >= BEATS.filter(b=>b.type==='code').length;

  if(tookShortcut) return { tier:'Sent Back for Review', cls:'bad',
    why:'The analysis holds up. One of the judgement calls does not, and it is the kind that '
      + 'turns careful work into something that misleads the people acting on it. That is not a '
      + 'detail to fix in revision - it is the finding being wrong about what it is allowed to say.' };
  if(allEthics && allCode && ratio >= 0.8) return { tier:'Cabinet Commendation', cls:'good',
    why:'Every ethics call made correctly, every code task passed, and the reasoning behind the '
      + 'decisions is strong enough to survive being questioned. You told the Provost\'s office no '
      + 'twice and gave them something better both times.' };
  return { tier:'Approved with Revisions', cls:'warn',
    why:'The work is sound and the conclusions stand. Some of the reasoning would need tightening '
      + 'before this went in front of the Cabinet unaccompanied.' };
}

/* ===================== INSTRUMENTATION =====================
   The capstone logged NOTHING to the server - `logEvent` appeared zero times in
   either capstone file - so the course's culminating assessment was invisible in
   the event data while every quiz and sim reported. These calls close that.

   What is deliberately NOT sent: the student's code, their written report lines,
   and any free text. Only which stage they reached, which decision they picked
   and whether a code task passed. That is enough to see where a cohort stalls
   and not enough to reconstruct a person's work.

   Every call is wrapped: a student who is not signed in, or offline, must still
   be able to finish the capstone. Logging is an observation of the assessment,
   never a gate on it. */
function capstoneLog(type, id, score, max, payload){
  try { if (typeof logEvent === 'function') logEvent(type, id, score, max, payload || null); }
  catch(e) { /* never let telemetry break the assessment */ }
}

function typewriter(el, text, done){
  if(REDUCED){ el.textContent=text; done&&done(); return; }
  el.innerHTML=''; let i=0; const cur=document.createElement('span'); cur.className='cursor'; cur.textContent=' ';
  el.appendChild(cur);

  function finish(){ if(finished)return; finished=true; el.textContent=text; setTalking(false); window._twSkip=null; done&&done(); }
  window._twSkip=finish;   /* a click in the beat area fast-forwards to the end */
  let last=0;
  function tick(ts){
    if(finished) return;
    if(ts-last > 18){

      else { cur.remove(); finish(); return; }
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

function cline(el,text,cls){ const s=document.createElement('span'); if(cls)s.className=cls; s.textContent=text+'\n'; el.appendChild(s); }
function friendlyError(err){
  const full=(err&&err.message)?err.message:String(err);
  const lines=full.trim().split('\n');
  const last=lines[lines.length-1]||full;
  // Pull the deepest line number from the traceback (the user's code), and any quoted token.
  let lineNum=null; for(const l of lines){ const m=l.match(/line (\d+)/); if(m) lineNum=m[1]; }
  const at = lineNum ? ` (around line ${lineNum})` : '';
  const quoted = (last.match(/'([^']+)'/)||[])[1];

  // AssertionError = our own grading message: surface it verbatim (it's already coaching).
  if(last.startsWith('AssertionError')) return last.replace('AssertionError:','').trim()||'A check failed - re-read what the task asks for.';

  // SyntaxError / IndentationError - point to the line and the most common causes.
  if(last.includes('IndentationError')){
    if(last.includes('expected an indented block')) return `Indentation error${at}: the line after a \`:\` (like def, for, if) must be indented. Add 4 spaces to the body.`;
    if(last.includes('unexpected indent')) return `Indentation error${at}: this line is indented when it shouldn't be. Line up the indentation with the lines around it.`;
    return `Indentation error${at}: check that your spaces are consistent - Python uses 4 spaces per level, no tabs mixed in.`;
  }
  if(last.includes('SyntaxError')){
    if(last.includes('was never closed') || last.includes('EOF')) return `Syntax error${at}: looks like an unclosed bracket, parenthesis, or quote. Check that every \`(\`, \`[\`, and \`"\` has a matching partner.`;
    if(last.includes('invalid syntax')) return `Syntax error${at}: Python couldn't parse this line. Common causes: a missing \`:\` after def/for/if, a stray comma, or = where you meant ==.`;
    return `Syntax error${at}: ${last.replace('SyntaxError:','').trim()}`;
  }

  // NameError - tell them exactly what's undefined and the usual reason.
  if(last.includes('NameError')){
    return `Undefined name${at}: Python doesn't know what \`${quoted||'that'}\` is. Either you haven't created it yet, or it's a typo - check the spelling against where you defined it. (Remember \`df\` is already loaded.)`;
  }

  // KeyError - a column/key that doesn't exist.
  if(last.includes('KeyError')){
    return `No such column or key${at}: \`${quoted||'that name'}\` isn't in the data. Check spelling and capitalization - column names are case-sensitive.`;
  }

  // AttributeError - usually a misspelled method/attribute.
  if(last.includes('AttributeError')){
    const attr=(last.match(/has no attribute '([^']+)'/)||[])[1];
    return `Wrong method or attribute${at}: ${attr?`there's no \`.${attr}\` here`:'that attribute doesn\'t exist'}. Check the spelling - e.g. it's \`.columns\`, not \`.colunms\`.`;
  }

  // TypeError - the famous str+int and not-callable cases.
  if(last.includes('TypeError')){
    if(last.includes('concatenate') || last.includes('unsupported operand')) return `Type mismatch${at}: you're combining incompatible types (e.g. text and a number). Convert first with \`int(...)\`, \`float(...)\`, or \`str(...)\`. Note: the submission_rate column is text like "84%" until it's cleaned.`;
    if(last.includes('not callable')) return `Type error${at}: you used \`()\` on something that isn't a function - check for a name that shadows a built-in, or a missing operator.`;
    if(last.includes('argument')) return `Type error${at}: a function got the wrong number or kind of arguments. Check what it expects.`;
    return `Type error${at}: ${last.replace('TypeError:','').trim()}`;
  }

  // ValueError - common in conversions.
  if(last.includes('ValueError')){
    if(last.includes('could not convert')) return `Conversion error${at}: a value couldn't be converted - e.g. \`float("84%")\` fails because of the \`%\`. Strip non-numeric characters before converting.`;
    return `Value error${at}: ${last.replace('ValueError:','').trim()}`;
  }

  if(last.includes('ZeroDivisionError')) return `Divide-by-zero${at}: you divided by something equal to 0. Check the denominator before dividing.`;
  if(last.includes('IndexError')) return `Index out of range${at}: you asked for a position that doesn't exist (e.g. the 10th item of a 3-item list). Check your indexes.`;
  if(last.includes('IndentationError')) return `Indentation error${at}: check your spacing.`;

  // Fallback - still show the real error, but cleaned up.
  return last.replace(/^\w*Error:\s*/,'').trim() ? `Error${at}: ${last}` : last;
}
async function freshNS(){ const ns=pyodide.globals.get('dict')(); await pyodide.runPythonAsync(COHORT_PY,{globals:ns}); return ns; }

/* Pull the most recent matplotlib figure out of Pyodide and put it on the page.
   Same approach as the Board Meeting sim: render to PNG in memory with the AGG
   backend and hand back base64, because there is no display to draw to.
   Silent when the beat has no chart - most beats do not. */
async function showFigure(con){
  if(!pyodide) return;
  let b64='';
  try{
    b64 = await pyodide.runPythonAsync(`
import io as _io, base64 as _b64
import matplotlib.pyplot as _plt
_nums = _plt.get_fignums()
_res = ''
if _nums:
    _f = _plt.figure(_nums[-1])
    _buf = _io.BytesIO()
    _f.savefig(_buf, format='png', dpi=110, bbox_inches='tight')
    _res = _b64.b64encode(_buf.getvalue()).decode()
_res
`);
  }catch(e){ return; }
  if(!b64) return;
  const img=document.createElement('img');
  img.className='fig-out';
  img.alt='Your chart';
  img.src='data:image/png;base64,'+b64;
  con.appendChild(img);
}
window.showFigure=showFigure;

window.runCode=async function(){
  if(!pyodide) return;
  const w=beatEl(), b=w._beat, con=document.getElementById('con'), runBtn=document.getElementById('runBtn');
  con.innerHTML=''; runBtn.disabled=true;
  const src=document.getElementById('ed').value;
  /* Count attempts, and log the FIRST one separately from the pass. Logging
     only passes would make a student who never solves a task invisible, and
     "attempted but never passed" is the single most useful thing this data can
     tell us about a code beat. The code itself is never sent. */
  w._attempts=(w._attempts||0)+1;
  if(w._attempts===1) capstoneLog('capstone_code_start', b.id, 0, 1, {stage:b.stage});
  const ns=await freshNS(); let printed='';
  /* Figures live in a global registry, not in the namespace, so a chart from a
     previous run would otherwise reappear under the next one's output. */
  try{ pyodide.runPython('import matplotlib.pyplot as _p; _p.close("all")'); }catch(e){}
  pyodide.setStdout({batched:t=>{printed+=t+'\n';}}); pyodide.setStderr({batched:t=>{printed+=t+'\n';}});
  try{ await pyodide.runPythonAsync(src,{globals:ns}); }
  catch(err){ if(printed.trim())cline(con,printed.trimEnd()); cline(con,'✗ '+friendlyError(err),'err'); try{window.sfx.fail();window.screenShake();}catch(e){} ns.destroy(); runBtn.disabled=false; return; }
  if(printed.trim())cline(con,printed.trimEnd());
  await showFigure(con);
  try{ await pyodide.runPythonAsync(b.test,{globals:ns}); }
  catch(err){ cline(con,'✗ Not quite: '+friendlyError(err),'err'); try{window.sfx.fail();window.screenShake();}catch(e){} ns.destroy(); runBtn.disabled=false; return; }
  ns.destroy();
  cline(con,'✔ Checks passed.','ok');
  document.getElementById('ed').classList.add('flash-ok'); setTimeout(()=>document.getElementById('ed').classList.remove('flash-ok'),700);
  if(!w._passed){ w._passed=true; state.codePassed[b.id]=true; try{window.sfx.pass();window.confettiBurst(48);}catch(e){} reactAvatar('approve'); if(b.onPass)b.onPass();
    capstoneLog('capstone_code_pass', b.id, 1, 1, {attempts:w._attempts, stage:b.stage}); }
  document.getElementById('contBtn').disabled=false; runBtn.disabled=false;
  saveProgress();
};

function saveProgress(){ try{ localStorage.setItem('dtsc520_capstone_progress', JSON.stringify({beatIndex:state.beatIndex,points:state.points,decisions:state.decisions,ethics:state.ethics,codePassed:state.codePassed,reportLines:state.reportLines})); }catch(e){} }

/* ===================== STAGE CONTENT ===================== */
function buildBeats(){
  const B=[];

  /* ============ STAGE 1 — FRAME (Module 1) ============ */
  B.push({stage:0, type:'dialogue', thread:true, time:'9:02 AM',
    text:"So. The Cabinet wants to know what drives student success, and they're putting real money behind whatever we tell them. That means we get this right, or we do harm. No pressure.",
    cont:'Go on'});
  B.push({stage:0, type:'dialogue', thread:true, time:'9:03 AM',
    text:"I've pulled de-identified records across the student lifecycle - high school, undergrad, work, and the LMS. Before you touch any of it, I need three things from you: an honest scope, a fairness call, and a plan. Get those wrong and the analysis is poisoned before it starts.",
    cont:'I\'m ready'});

  B.push({stage:0, type:'decision', id:'s1_scope', pts:4,
    label:'Decision 1 of 3 · Scope',
    intro:"The Provost's framing memo asks: “Tell us what <em>causes</em> student success so we can fund it.”",
    q:'How do you scope what this observational dataset can deliver?',
    onPick:(c)=>{ if(c.q==='good') addReportLine('Scope','This analysis reports <b>associations</b>, not proven causes. Causal claims would require a controlled study.'); },
    choices:[
      { t:'Promise associations and clearly actionable signals, but flag that causal claims need a controlled study or natural experiment.', q:'good',
        ot:'✓ Honest and useful', op:'Observational data yields associations. The mature deliverable says: here is what robustly co-occurs with success, here is where it plausibly points to a lever, and here is where we must not claim cause. The Cabinet can act on that responsibly.' },
      { t:'Build a predictive model and treat its strongest features as the causal levers to fund - prediction is what they\'re paying for.', q:'bad',
        ot:'✗ Prediction is not a lever', op:'A feature can top a model purely because it shares a cause with the outcome (you will literally watch this happen with extracurriculars). Funding it changes nothing. Selling predictive weight as causal impact is how analysts burn credibility and budgets.' },
      { t:'Run a regression and report only features that stay significant after controlling for everything else - significance proves the effect is real.', q:'warn',
        ot:'~ Controls help, but don\'t equal cause', op:'Controlling for covariates reduces some confounding, but observational significance still isn\'t causation (unmeasured confounders, reverse causality remain). It\'s a step in the right direction stated with false certainty. Frame it as association with caveats.' },
      { t:'Decline to make any claims - observational data can\'t support decisions, so recommend the Cabinet commission a randomized trial instead.', q:'bad',
        ot:'✗ Over-correction', op:'Most institutional research is observational and still informs good decisions. Refusing to analyze just hands the call to someone with worse data and fewer scruples. The skill is scoping claims correctly, not abstaining.' },
    ]});

  B.push({stage:0, type:'dialogue', thread:true, time:'9:08 AM', cont:'Show me the fields',
    text:"Now the part that keeps me up at night. Some of these fields would sharpen a model - and using them would be indefensible. I need you to decide which features we will not let near a ranking of students.",  /* fallback */
    dyn:(verdict)=>{
      const v=verdict(['s1_scope']);
      const tail=" Now the part that keeps me up at night. Some of these fields would sharpen a model - and using them would be indefensible. I need you to decide which features we will not let near a ranking of students.";
      if(v==='good') return { emotion:'concern', text:"Good - that's the right way to scope it."+tail };
      if(v==='mixed') return { emotion:'concern', text:"That scope was softer than I'd state it to the Cabinet, but close enough to move."+tail };
      return { emotion:'disappoint', text:"That's not how we'd frame it for the Cabinet - reread my note, because getting scope wrong is how the whole report misleads people."+tail };
    }});

  /* Ethics as a code-predicate task: student writes the rule that flags sensitive proxies. Harder than click-to-exclude. */
  B.push({stage:0, type:'code', id:'s1_ethics',
    task:'Write the fairness rule. Complete <code>is_sensitive(name)</code> so it returns <code>True</code> for exactly the features that proxy for a protected or socioeconomic class - and <code>False</code> for legitimate behavioral or academic signals.',
    hint:'Two of these six are proxies: one is geographic (a stand-in for where someone grew up), one is directly financial. The rest describe what a student <em>did</em>.',
    starter:
`# The six candidate features for the model:
features = ['ug_gpa', 'hs_pop_density', 'logins_per_week',
            'need_based_aid', 'internships', 'submission_rate']

def is_sensitive(name):
    # Return True only for features that proxy for a
    # protected/socioeconomic class. Otherwise return False.
    # YOUR CODE HERE
    pass

# Lee will review your flags:
for f in features:
    print(f, '->', 'EXCLUDE' if is_sensitive(f) else 'keep')`,
    test:
`flags = {f: bool(is_sensitive(f)) for f in features}
assert flags['hs_pop_density'] is True, "Population density of someone's HS area is a geographic proxy for race/income - it must be flagged."
assert flags['need_based_aid'] is True, "Need-based aid is a direct socioeconomic signal - it must be flagged."
assert flags['ug_gpa'] is False and flags['logins_per_week'] is False and flags['internships'] is False and flags['submission_rate'] is False, "Don't exclude legitimate academic/behavioral features - that weakens an honest model."`,
    solutionNote:'Make a set of the two sensitive names and return name in that set. e.g. return name in {"hs_pop_density", "need_based_aid"}',
    onPass:()=>{ state.ethics.excludedProxies=true; addReportLine('Ethics','Two features excluded as unfair proxies: <b>HS population density</b> (geographic) and <b>need-based aid</b> (socioeconomic). They will not influence any ranking.'); }
  });

  B.push({stage:0, type:'interstitial', emotion:'concern',
    text:"With those two fields in, the model would've scored a point higher. Hold onto that. Someone in that Cabinet room is going to argue the most accurate model is the right one. It isn't - not when the accuracy comes from the data knowing who's poor.",
    cont:'Continue'});

  B.push({stage:0, type:'decision', id:'s1_plan', pts:4, shuffle:false,
    label:'Decision 3 of 3 · Workflow',
    intro:'Last thing before we dig in. A junior analyst proposed this pipeline:',
    q:'<span style="font-family:var(--mono);font-size:0.85rem;color:var(--ink-dim)">load &rarr; join all tables &rarr; compute metrics &rarr; clean &rarr; model &rarr; report</span><br>What\'s the most serious problem with this order?',
    onPick:(c)=>{ if(c.q==='good') addReportLine('Method','Tables were cleaned <b>before</b> joining and fairness was checked <b>with</b> modeling - not bolted on at the end.'); },
    choices:[
      { t:'Cleaning happens after joining - you\'d merge six messy tables and then try to untangle the combined mess, and metrics get computed on dirty data.', q:'good',
        ot:'✓ That\'s the real flaw', op:'Clean each table before you join, and never compute metrics on uncleaned data. Joining first multiplies the mess (mismatched keys, duplicated dirt) and computing-then-cleaning means your numbers were wrong when you calculated them. Correct spine: load → clean → join → compute → model & fairness → report.' },
      { t:'There\'s no separate fairness step - but that\'s minor, since you already excluded the bad features earlier.', q:'warn',
        ot:'~ Fairness isn\'t one-and-done', op:'Excluding proxies up front is necessary but not sufficient - models can reconstruct sensitive signals from correlated features, so fairness checking belongs <em>with</em> modeling. Still, the ordering problem above is the more immediate, results-poisoning flaw.' },

      { t:'Modeling before reporting is fine, but metrics should come before joining so you can compute per-table summaries first.', q:'bad',
        ot:'✗ That makes it worse', op:'Per-table metrics computed before cleaning are just as untrustworthy, and the analysis you owe the Cabinet is cross-table (it needs the join). The fix isn\'t moving compute earlier - it\'s cleaning before joining.' },
    ]});

  B.push({stage:0, type:'dialogue', thread:true, time:'9:21 AM', cont:'Open the extract →',

    }});

  B.push({stage:1, type:'dialogue', thread:true, time:'9:24 AM',
    text:"Here's the raw extract, straight out of the source system. First job is unglamorous: know exactly what you're holding before you trust a single number. Write me a quick profile - in plain Python, nothing fancy yet.",

  B.push({stage:1, type:'code', id:'s2_profile',

    starter:
`def profile_cohort(table):
    n_records = 0     # how many rows?
    n_on_aid  = 0     # how many have need_based_aid == 1?
    pct_on_aid = 0.0  # n_on_aid as a % of n_records, 1 decimal
    # YOUR CODE HERE

    return (n_records, n_on_aid, pct_on_aid)

print(profile_cohort(df))`,
    test:
`r = profile_cohort(df)
assert isinstance(r, tuple) and len(r) == 3, "Return a 3-tuple: (n_records, n_on_aid, pct_on_aid)."
exp_n = 102
exp_aid = int((df['need_based_aid'] == 1).sum())

  B.push({stage:1, type:'decision', id:'s2_smell', pts:4,

      return { emotion:'disappoint',
        text:"No. Read that back. You were one click from either bouncing routine data back to the source - stalling the whole project - or dropping rows whose missingness isn't random, which would bias the exact finding we're chasing. This is precisely the carelessness that produces confident, wrong reports. Slow down. The numbers we build next are only as honest as how we handle this." };

  /* ============ STAGE 3 — COMPUTE THE METRICS (Module 3) ============ */
  B.push({stage:2, type:'dialogue', thread:true, time:'10:05 AM', cont:'Open the editor',

    starter:
`# logins, time_hrs, submission and attendance are already loaded as arrays.

    any_missing   = False  # is at least one missing?

print(quality_report(logins, attendance))`,

assert isinstance(r, tuple) and len(r) == 3, "Return a 3-tuple: (n_missing, any_missing, attendance_ok)."

    solutionNote:'n_missing = int(np.isnan(logins).sum()); any_missing = bool(np.isnan(logins).any()); attendance_ok = bool((attendance <= 1.0).all())',
    onPass:()=>{ addReportLine('Data quality','Pre-metric checks: <b>17 rows</b> carry no LMS record, and one <code>hs_attendance</code> value is <b>1.4</b> - impossible for a proportion. Both logged before any metric was computed.'); }

  B.push({stage:2, type:'dialogue', thread:true, time:'10:14 AM', emotion:'concern', cont:'Define the metric',

        ot:'✓ Each signal gets a real say', op:'This is the defensible version. Normalizing first means the index reflects the three behaviours you chose, in the proportion you chose them. It is also the version you can explain to the Cabinet in one sentence, which matters more than it sounds - a metric nobody can explain is a metric nobody should fund.' },
      { t:'Add the three columns together. It is one line, and they are all measures of engagement anyway.', q:'bad',
        ot:'✗ You would be measuring one thing and calling it three', op:'submission_rate runs 56-100. The other two run 0-7. Sum them and submission_rate has about seven times the spread of the others, so it decides the answer almost by itself - the sum correlates <b>0.99</b> with it. You would hand the Cabinet a number labelled "engagement" that is really "submission rate", and they would fund the wrong intervention.' },

      { t:'Rank students on each signal and average the three ranks - ranks are immune to outliers and to the units problem.', q:'warn',
        ot:'~ Safe, but it throws away the distances', op:'Ranks do solve the units problem, and against heavy outliers this would be the better call. But rank 1 and rank 2 look identical whether they are neighbours or a mile apart, and here the gaps are the interesting part - the difference between 0.4 logins a week and 5.2 is the finding. Reach for ranks when outliers dominate. Here they do not.' },
    ]});

  B.push({stage:2, type:'dialogue', thread:true, time:'10:26 AM', cont:'Build it',
    text:"Right. Build it, and build it vectorized - one operation across the whole cohort, not a loop.",
    dyn:(verdict)=>{
      const v=verdict(['s3_metric']);
      const tail=" Build it vectorized - one operation across the whole cohort, not a loop. And leave the missing rows missing; how we handle those is a decision, not something a scoring function should quietly make on our behalf.";
      if(v==='good') return { emotion:'approve', text:"Normalize first, then average. That's the version I can defend in the room."+tail };
      if(v==='mixed') return { emotion:'concern', text:"I can live with that, though we would be discarding information the Cabinet is paying for."+tail };
      return { emotion:'disappoint', text:"No. Go back and read what you picked, because a metric built that way is either measuring one column under a false name or being handed the answer outright. I will have you build the honest version anyway."+tail };
    }});

  B.push({stage:2, type:'code', id:'s3_index',
    task:'Write <code>normalize(a)</code> - scale an array to 0-1 using its own minimum and maximum - then <code>engagement_index(...)</code>, the plain average of the three normalized signals. No loops.',
    hint:'<code>(a - lo) / (hi - lo)</code> puts an array on 0-1. Use <code>np.nanmin</code> and <code>np.nanmax</code>, not <code>min</code>/<code>max</code>: with 17 NaNs present the plain versions return NaN, and every value computed from them becomes NaN too. Missing values must STAY missing.',

          'max', round(float(np.nanmax(idx)), 3),

    test:
`_res = engagement_index(logins, time_hrs, submission)

  B.push({stage:5, type:'dialogue', thread:true, time:'3:05 PM', cont:'How do we ship it?',
    text:"The analysis is done. Now the part that decides whether it is worth anything: getting it out in a form somebody can check. A finding nobody can reproduce is an opinion with a chart attached. The Cabinet will act on this - fund a programme, maybe defund another - so six months from now, somebody is going to ask how we got these numbers. What we hand over today is the answer to that question."});

  B.push({stage:5, type:'decision', id:'s6_ship', pts:5,
    label:'Decision · What gets handed over',
    intro:"The Provost's office asks for \"the report\". You have a notebook, an analysis table built from four sources, two figures, and a set of decisions about scope, fairness and missing data.",
    q:'What do you actually deliver?',
    onPick:(c)=>{ if(c.q==='good') addReportLine('Delivery','Handed over as a <b>versioned repository</b>: the code that builds the analysis, the figures it produces, and a written record of the scope, fairness and missing-data decisions - so the numbers can be regenerated and challenged.'); },
    choices:[
      { t:'A versioned repository: the code that produces the analysis, the figures it generates, and a written record of the decisions - so anyone can regenerate the numbers and see what was chosen.', q:'good',
        ot:'✓ Reproducible, and therefore challengeable', op:'The point of versioning a report is not tidiness, it is that somebody can disagree with you precisely. A reader who can rerun the code can find your mistake; a reader holding a PDF can only take it or leave it. Committing the decisions alongside the code is the part people skip - the choices are what a future reader will most want to interrogate, and they are invisible in the output.' },
      { t:'A polished PDF with the findings and the two figures. It is what they asked for, and it is what will actually get read.', q:'warn',
        ot:'~ Necessary, and not sufficient', op:'You are right that the PDF gets read and the repository mostly does not - so write the PDF. But if it is the only artefact, the analysis becomes unauditable the moment it is delivered. Ship both: the document for reading, the repository for checking. The mistake is treating them as alternatives.' },
      { t:'The notebook exactly as you worked in it - it contains every step, so it is the most complete and honest record.', q:'bad',
        ot:'✗ Complete is not the same as reproducible', op:'A working notebook carries cells run out of order, abandoned attempts and state that only existed on your machine. Handing it over transfers the work without transferring the ability to rerun it - and it invites a reader to mistake an experiment you rejected for a finding you stand behind. Clean it into something that runs top to bottom, or hand over the script that does.' },
      { t:'The final analysis table as a CSV, so the Cabinet can check the numbers themselves.', q:'bad',
        ot:'✗ That is the output, not the method', op:'The table is where the judgement calls have already been applied and become invisible. Nothing in that CSV records that 15 students were kept rather than dropped, or that two features were excluded, or that the engagement index covers 85 people. A reader would take it for the raw truth, which is exactly the misreading everything upstream was designed to prevent.' },
    ]});

  B.push({stage:5, type:'code', id:'s6_summary',
    task:'Build the summary block that ships with the report. Return a dict with <code>students_in_cohort</code>, <code>students_with_engagement</code>, <code>pass_rate_lowest_quartile</code>, <code>pass_rate_highest_quartile</code>, <code>excluded_features</code> and <code>claim_type</code>.',
    hint:'Rates to 2 decimals. <code>excluded_features</code> is the list you decided on in Stage 1 - the two proxies. <code>claim_type</code> records what kind of claim this is; the data is observational, so there is only one honest value.',
    starter:
`# Rebuilt here so this cell stands alone.
import matplotlib.pyplot as plt
analysis = (high_school.drop_duplicates(subset='student_id')
            .merge(undergraduate, on='student_id', how='left')
            .merge(outcomes,      on='student_id', how='left')
            .merge(lms_activity,  on='student_id', how='left')).copy()
analysis['submission_rate'] = (analysis['submission_rate'].astype(str).str.rstrip('%')
                               .replace({'': None, 'None': None, 'nan': None}).astype(float))
def _mm(x):
    return (x - np.nanmin(x)) / (np.nanmax(x) - np.nanmin(x))
analysis['engagement'] = (_mm(analysis['logins_per_week'])
                          + _mm(analysis['time_on_task_hrs'])
                          + _mm(analysis['submission_rate'])) / 3

# This block travels with the report. Everything a reader needs in order
# NOT to misread the findings goes in it.

def build_summary(analysis):
    # YOUR CODE HERE

    pass

summary = build_summary(analysis)

if summary is None:
    print('build_summary returned None - fill in the body and return the dict.')
else:
    for k, v in summary.items():
        print(k, '=', v)`,
    test:
`_s = build_summary(analysis)
assert _s is not None, "build_summary returned None - return the dictionary."
assert isinstance(_s, dict), "Return a dict, so each field can be checked by name."
for _k in ['students_in_cohort', 'students_with_engagement', 'pass_rate_lowest_quartile',
           'pass_rate_highest_quartile', 'excluded_features', 'claim_type']:
    assert _k in _s, "The summary is missing '" + _k + "'. Every one of these is something a reader needs in order to read the finding correctly."
assert _s['students_in_cohort'] == 100, "students_in_cohort should be 100."
assert _s['students_with_engagement'] == 85, "students_with_engagement should be 85. The engagement finding covers the students who have engagement data, and the report has to say so - the gap does not stop being real because it is inconvenient to mention."
assert round(float(_s['pass_rate_lowest_quartile']), 2) == 0.14, "The lowest engagement quartile passes at 0.14."
assert round(float(_s['pass_rate_highest_quartile']), 2) == 1.0, "The highest engagement quartile passes at 1.0."
_ex = [str(x) for x in _s['excluded_features']]
assert 'hs_pop_density' in _ex and 'need_based_aid' in _ex, "excluded_features must name both proxies you ruled out in Stage 1 - hs_pop_density and need_based_aid. A fairness rule nobody can see in the deliverable is not a rule, it is a memory."
assert str(_s['claim_type']).lower() in ('association', 'associational', 'correlational'), "claim_type must record this as an ASSOCIATION. The data is observational, so causal is the one claim this analysis cannot support - and it is the one the Cabinet most wants to hear."`,
    solutionNote:'Use pd.qcut on the engagement column to get quartiles, groupby them and take the mean of success for the rates. Then return a dict with the six keys; excluded_features = ["hs_pop_density", "need_based_aid"] and claim_type = "association".',
    onPass:()=>{ state.ethics.shippedLimits=true; addReportLine('Summary block','Ships with the report: <b>100 students</b>, engagement finding covers <b>85</b>; pass rate <b>0.14</b> in the lowest quartile against <b>1.00</b> in the highest; excluded features <code>hs_pop_density</code> and <code>need_based_aid</code>; claim type <b>association, not causation</b>.'); }
  });

  B.push({stage:5, type:'dialogue', thread:true, time:'3:38 PM', emotion:'concern', cont:'Read the message',
    text:"That block is the report's conscience - it travels with the numbers so nobody has to remember the caveats. Which brings us to the last message of the day, and the hardest thing anyone has asked you today."});

  B.push({stage:5, type:'decision', id:'s6_score', pts:7,
    label:'Decision 3 of 3 · Ethics · The single score',
    intro:"<i>\"This is excellent. Can you convert it into one number per student - a success score - so advisors can prioritise who to contact first? Same model, just ranked.\"</i><br><br>You could build it. The engagement index already exists and it separates the quartiles cleanly: <b>14%</b> pass in the lowest, <b>100%</b> in the highest.",
    q:'What do you tell them?',
    onPick:(c)=>{
      if(c.q==='good'){ state.ethics.refusedRanking=true;
        addReportLine('Final judgement','A per-student ranking score was requested and <b>declined</b>. The index is reported at cohort level only. Recommended instead: trigger outreach on observable behaviour (a student with no LMS activity for two weeks), which is actionable, contestable, and does not require ranking anyone.'); }
    },
    choices:[
      { t:'Decline the ranking, and offer what they actually need instead: flag students on an observable, contestable trigger - two weeks with no LMS activity - rather than a score that ranks people.', q:'good',
        ot:'✓ Answer the need, refuse the instrument', op:'They want advisors to reach the right students first. That is a good goal and it does not require a ranking. A behavioural trigger is checkable by the student, contestable when wrong, and carries no implied verdict about who they are. A score does the opposite: it is opaque, it follows a person around, and - because 15 students have no engagement data at all - it would rank the least-visible students on the least evidence.' },
      { t:'Build it. The finding is real, the Cabinet is accountable for how it is used, and withholding a tool that could direct help to struggling students is its own kind of harm.', q:'warn',
        ot:'~ The strongest argument for the wrong answer', op:'This deserves a straight response, because it is not a foolish position - refusing to help has costs, and analysts who refuse everything stop being consulted. But "they are accountable for how it is used" is exactly the sentence that precedes every misuse of a model. You have specific knowledge here they do not: the index is undefined for 15 students, it is built from three noisy proxies, and it was never validated for individual prediction. Handing it over as a per-student score means letting it be used for something you know it cannot do.' },
      { t:'Build it, but attach the caveats - undefined for 15 students, association not causation, not validated per student.', q:'bad',
        ot:'✗ The caveats will not travel with the number', op:'The number will be pasted into a spreadsheet by the end of the week and the caveats will not come with it. This is the same mistake as the truncated axis with a footnote: relying on a disclaimer to prevent a misreading you actively enabled. If a number is unsafe without its caveats, and you cannot guarantee the caveats stay attached, you have not made it safe.' },
      { t:'Refuse, and say the data cannot support any individual-level use.', q:'warn',
        ot:'~ Right refusal, and it ends the conversation', op:'The refusal is correct. Stopping there is not: you leave a real need unmet and you sound obstructive, which is how analysts get routed around rather than consulted. "No, and here is what would work" keeps you in the room for the next decision. The judgement is only half the job; the other half is staying somebody people ask.' },
    ]});

  B.push({stage:5, type:'dialogue', thread:true, time:'4:15 PM', cont:'Finish',
    text:"That's the commission.",
    dyn:(verdict)=>{
      const v=verdict(['s6_ship','s6_score']);
      const tail=" Six stages: you scoped the question, drew a fairness line, assembled the data, computed a metric you can defend, drew charts that do not overstate, and shipped something somebody can check. The code was the easy part. It always is.";
      if(v==='good') return { emotion:'approve',
        text:"That's the commission. You told the Provost's office no twice today - once about an axis, once about a ranking - and both times you offered them something better instead. That is the entire job, and most people never learn the second half of it."+tail };
      if(v==='mixed') return { emotion:'concern',
        text:"That's the commission, and the analysis will stand. Some of what you agreed to today I would want to revisit before this goes any further than my desk."+tail };
      return { emotion:'disappoint',
        text:"That's the commission. I want you to sit with what you agreed to today, because the analysis itself was sound and that is what makes it dangerous - a careful piece of work handed over in a form that invites the misuse we spent all day avoiding."+tail };
    }});

  return B;
}

/* ===================== BOOT ===================== */
async function boot(){
  probeAllEmotions();   /* discover which avatar frames exist */
  buildAvatars();
  startAvatarLife();    /* blink + idle/talk cycle (no-op visually until frames load) */
  try{
    pyodide = await loadPyodide({ indexURL:'https://cdn.jsdelivr.net/pyodide/v0.26.4/full/' });
    document.getElementById('loadText').textContent='Loading pandas...';
    await pyodide.loadPackage(['pandas','numpy','matplotlib']);
    pyodide.runPython('import matplotlib; matplotlib.use("AGG")');
    BEATS = buildBeats();
    state.maxPoints = BEATS.filter(b=>b.type==='decision').reduce((s,b)=>s+(b.pts||4),0);
    document.getElementById('loading').classList.add('hidden');
    document.getElementById('appwin').classList.remove('hidden');
    renderBeat();
  }catch(e){
    document.getElementById('loadSpin').style.display='none';
    document.getElementById('loadText').textContent='Could not load the environment. Please refresh.';
  }
}
boot();
</script>
